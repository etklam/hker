name: Directory acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: directory-test
          POSTGRES_DB: hker_directory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:directory-test@127.0.0.1:5432/hker_directory_test
      ALLOW_DIRECTORY_TEST_RESET: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/acceptance.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - run: npx playwright install --with-deps webkit
        id: webkit_install
        continue-on-error: true
      - run: npm run test:e2e:webkit
        if: steps.webkit_install.outcome == 'success'
      - run: node -e "require('fs').writeFileSync('artifacts/release-candidate/webkit-blocked.json',JSON.stringify({status:'BLOCKED',reason:'Optional WebKit installation unavailable',skippedTests:'not executed'}))"
        if: steps.webkit_install.outcome == 'failure'
      - run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t hker:ci . 2>&1 | tee artifacts/release-candidate/docker-build.log
        shell: bash
      - run: docker image inspect hker:ci --format '{{.Id}}' > artifacts/release-candidate/image-digest.txt
      - run: node scripts/rc-runtime-rehearsal.mjs --image=hker:ci > artifacts/release-candidate/runtime-console.log 2>&1
      - run: python3 scripts/sanitize-evidence.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          retention-days: 7
          path: |
            artifacts/release-candidate
            test-results
            playwright-report
            .impeccable/review
